org: ${file(./local.yml):org}
service: shui

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  environment:
    TABLE_NAME: ${self:service}-${sls:stage}
    JWT_SECRET: ${env:JWT_SECRET}
  iam:
    role: ${file(./local.yml):role}

package:
  patterns:
    - '!.vs/**'
    - '!.git/**'
    - '!README.md'
    - '!local.yml'


functions:

## AUTH
  register: 
    handler: src/functions/auth/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST

  login:
    handler: src/functions/auth/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST

#  test:
#      handler: src/functions/test/index.handler
#      events:
#          - httpApi:
#                path: /test
#                method: '*'

  testRequired:
    handler: src/functions/test/index.required
    events:
      - httpApi:
          path: /test/required
          method: GET
  testOptional:
    handler: src/functions/test/index.optional
    events:
      - httpApi:
          path: /test/optional
          method: GET
  


resources:
  Resources:
    ShuiTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NAME}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL


